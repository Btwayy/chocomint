<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ʕ •ᴥ•ʔ</title>

    <script>
      /*

    <style>
        :root { --accent: #ff8fa3; --text: #4a4a4a; }

        .dG9reW8gdW5pdmVyc2l0eQ {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('./bg.jpg'); background-size: cover;
            background-position: center; z-index: -2;
        }

        .cmlnYWt1YnUgNy1nb2thbg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, rgba(255, 250, 251, 0.85), rgba(255, 255, 255, 0.65));
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); z-index: -1;
        }

        .SG9saWRheQ {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 99; overflow: hidden;
        }

        .bWludA {
            position: absolute; width: 15px; height: 15px;
            background: #ffb7c5; border-radius: 150% 0 150% 150%;
            opacity: 0.7; animation: vfall linear infinite;
        }

        @keyframes vfall { 0% { top: -10%; transform: translateX(0) rotate(0); } 100% { top: 110%; transform: translateX(100px) rotate(360deg); } }
        @keyframes vfadeIn { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }

        .Z2F0ZWF1IGNob2NvbGF0 {
            position: relative; z-index: 1;
            display: flex; flex-direction: column; align-items: center;
            padding: 25px; max-width: 450px; width: 90%;
            margin: 0 auto; min-height: 100vh;
            animation: vfadeIn 1s ease-out;
            gap: 20px;
        }

        .c2lraWNoYW4 { color: var(--accent); font-size: 1.8rem; font-weight: 600; margin-bottom: 5px; }

        .c2Fuc2hpcm9pa2U {
            position: relative; padding-bottom: 56.25%; height: 0; border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1); overflow: hidden; background: #000; width: 100%;
        }

        .aHR0cHM6Ly9taW50YnR3LnZlcmNlbC5hcHAvYXBpL3Npa2ljaGFu {
            background: rgba(255, 255, 255, 0.8);
            padding: 25px; border-radius: 20px;
            text-align: left; line-height: 1.9; font-size: 0.95rem;
            box-shadow: 0 10px 30px rgba(0,0,0,0.02);
            width: 100%; box-sizing: border-box;
        }

        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: sans-serif; overflow-x: hidden; }
        b { color: var(--accent); font-weight: bold; border-bottom: 1.5px dashed var(--accent); }
    </style>
</head>
<body>
    <div class="dG9reW8gdW5pdmVyc2l0eQ"></div>
    <div class="cmlnYWt1YnUgNy1nb2thbg"></div>
    <div class="SG9saWRheQ" id="v-canvas"></div>

    <div id="root" class="Z2F0ZWF1IGNob2NvbGF0"></div>

    <script>
        function start() {
            const c = document.getElementById('v-canvas');
            for (let i = 0; i < 30; i++) {
                const p = document.createElement('div');
                p.className = 'bWludA';
                p.style.left = Math.random() * 100 + '%';
                p.style.top = Math.random() * -20 + '%';
                p.style.animationDuration = Math.random() * 5 + 5 + 's';
                p.style.animationDelay = Math.random() * 5 + 's';
                c.appendChild(p);
            }
        }
        start();

        const root = document.getElementById('root');
        let done = false;

        async function tick() {
            try {
                const res = await fetch('/api/get-status');
                const d = await res.json();

                if (d.active && !done) {
                    done = true;
                    show(d);
                } else if (!d.active) {
                    wait(d.timestamp_diff);
                }
            } catch (e) { console.error(e); }
        }

        function show(data) {
            const info = data.meta_desc.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
            root.style.justifyContent = 'flex-start';

            const containerId = 'node-' + Math.random().toString(36).substr(7);

            root.innerHTML = `
                <div class="c2lraWNoYW4">${data.header_text}</div>
                <div class="c2Fuc2hpcm9pa2U" id="${containerId}"></div>
                <div class="aHR0cHM6Ly9taW50YnR3LnZlcmNlbC5hcHAvYXBpL3Npa2ljaGFu">${info}</div>
            `;

            const config = data.ui_config;
            if (!config) return;

            const mediaNode = document.createElement(config.t);
            mediaNode.controls = true;
            mediaNode.playsInline = true;
            mediaNode.poster = "./bg.jpg";

            Object.assign(mediaNode.style, {
                position: 'absolute',
                top: '0',
                left: '0',
                width: '100%',
                height: '100%',
                outline: 'none',
                borderRadius: '24px'
            });

            const sourceNode = document.createElement(config.s);
            sourceNode.src = data.payload_url;
            sourceNode.type = config.m;

            mediaNode.appendChild(sourceNode);
            document.getElementById(containerId).appendChild(mediaNode);
        }

        function wait(ms) {
            const totalSeconds = Math.max(0, Math.floor(ms / 1000));

            const d = Math.floor(totalSeconds / 86400);
            const h = Math.floor((totalSeconds % 86400) / 3600);
            const m = Math.floor((totalSeconds % 3600) / 60);
            const s = totalSeconds % 60;
            const timeStr = `${d.toString().padStart(2, '0')}:${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;

            root.style.justifyContent = 'center';
            root.style.display = 'flex';
            root.style.flexDirection = 'column';
            root.style.alignItems = 'center';

            root.innerHTML = `
                <div style="font-size:3.5rem; color:#ff8fa3; font-weight:100; letter-spacing:2px; white-space:nowrap;">
                    ${timeStr}
                </div>
                <p style="color:#cc99a2; margin-top:15px; letter-spacing:1px; font-size:0.9rem;">Next Surprise, Coming Soon......ʕ •ᴥ•ʔ</p>
            `;
        }



        setInterval(tick, 1000);
        tick();
    </script>
</body>
</html>

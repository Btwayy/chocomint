<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ʕ •ᴥ•ʔ</title>

<style>

:root{
    --text:#ffffff;
    --sub:rgba(255,255,255,.78);
    --glass:rgba(255,255,255,.05);
    --border:rgba(255,255,255,.18);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
}

body{
    overflow:hidden;
    color:var(--text);

    font-family:
        "Hiragino Sans",
        "Yu Gothic",
        "Noto Sans JP",
        sans-serif;
}

.bg-image{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    object-position:center center;
    z-index:-3;
}

.bg-top-stars {
    display: none;
}

@media (max-width:768px) and (orientation:portrait){
    .bg-image{
        height: 60%;
        top: auto;
        bottom: 0;
        object-fit:contain;
        object-position:center bottom;
        background: transparent;
        -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
        mask-image: linear-gradient(to top, rgba(0,0,0,1) 70%, rgba(0,0,0,0) 100%);
    }

    .bg-top-stars {
        display: block;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 55%;
        background: url('./hoshizora.jpg') no-repeat center top;
        background-size: cover;
        z-index: -3;
        -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,0) 100%);
        mask-image: linear-gradient(to bottom, rgba(0,0,0,1) 65%, rgba(0,0,0,0) 100%);
    }
}

.overlay{
    position:fixed;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(5,10,20,.15),
            rgba(8,12,25,.25),
            rgba(10,15,30,.35)
        );
    backdrop-filter:blur(1.5px);
    -webkit-backdrop-filter:blur(1.5px);
    z-index:-2;
}

.meteor-layer{
    position:fixed;
    inset:0;
    overflow:hidden;
    pointer-events:none;
    z-index:-1;
}

.meteor{
    position:absolute;
    width:1px;
    height:90px;
    border-radius:999px;
    background:
        linear-gradient(
            to bottom,
            rgba(255,255,255,0),
            rgba(255,255,255,.8)
        );
    opacity:0;
    transform:rotate(225deg);
    animation:meteor linear infinite;
}

.big-meteor{
    width:1.5px;
    height:140px;
    box-shadow:
        0 0 6px rgba(255,255,255,.7),
        0 0 12px rgba(255,255,255,.35);
}

@keyframes meteor{
    0%{
        opacity:0;
        transform:
            translate(0,0)
            rotate(225deg);
    }
    5%{
        opacity:1;
    }
    90%{
        opacity:1;
    }
    100%{
        opacity:0;
        transform:
            translate(-1000px,1000px)
            rotate(225deg);
    }
}

.container{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:30px;
}

.title{
    font-size:1rem;
    letter-spacing:5px;
    margin-bottom:12px;
    color:white;
    text-shadow:
        0 2px 10px rgba(0,0,0,.25);
}

.subtitle{
    color:var(--sub);
    font-size:.9rem;
    letter-spacing:2px;
    margin-bottom:42px;
    text-shadow:
        0 2px 10px rgba(0,0,0,.25);
}

.cards{
    width:min(430px,90vw);
    display:flex;
    flex-direction:column;
    gap:24px;
}

.card{
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:26px;
    padding:28px;
    text-align:center;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    box-shadow:
        0 10px 30px rgba(0,0,0,.12);
    animation:float 8s ease-in-out infinite;
}

.card:nth-child(2){
    animation-delay:4s;
}

@keyframes float{
    0%,100%{
        transform:translateY(0);
    }
    50%{
        transform:translateY(-6px);
    }
}

.card-title{
    color:var(--sub);
    font-size:.95rem;
    letter-spacing:2px;
    margin-bottom:16px;
}

.time{
    font-size:clamp(2rem,5vw,3.3rem);
    font-weight:200;
    letter-spacing:2px;
    white-space:nowrap;
    text-shadow:
        0 0 10px rgba(255,255,255,.25),
        0 0 20px rgba(255,255,255,.10);
}

.middle-star{
    margin-top:20px;
    color:rgba(255,255,255,.7);
}

.footer{
    margin-top:18px;
    color:rgba(255,255,255,.8);
    font-size:.9rem;
    letter-spacing:2px;
    text-shadow:
        0 2px 10px rgba(0,0,0,.2);
}

@media (max-width:768px) and (orientation:portrait){
    .container{
        padding:24px;
        justify-content: flex-start;
        padding-top: 60px;
    }

    .title{
        margin-bottom:8px;
        font-size:.95rem;
    }

    .subtitle{
        margin-bottom:26px;
        font-size:.82rem;
        text-align:center;
        line-height:1.6;
    }

    .cards{
        width:100%;
        max-width:320px;
        gap:18px;
    }

    .card{
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 20px;
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
        padding: 20px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15);
        animation: float 8s ease-in-out infinite;
    }

    .card:first-child{
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
        padding-bottom: 20px;
    }

    .card-title{
        margin-bottom:10px;
        font-size:.85rem;
    }

    .time{
        font-size:1.85rem;
        letter-spacing:1px;
    }

    .middle-star{
        margin-top:24px;
    }

    .footer{
        margin-top:14px;
        font-size:.85rem;
    }
}

</style>
</head>

<body>

<div class="bg-top-stars"></div>

<img
    src="./summer_school.png"
    class="bg-image"
    alt=""
/>

<div class="overlay"></div>

<div
    class="meteor-layer"
    id="meteors">
</div>

<div class="container">

    <div class="title">
        OPLSS SUMMER SCHOOL
    </div>

    <div class="subtitle">
        いっぱい楽しんでおいで！<br/>
        帰ってきたらたくさん話聞かせてね
        ^^
    </div>

    <div class="cards">

        <div class="card">

            <div class="card-title" id="leaveTitle">
                日本を発ってから
            </div>

            <div
                class="time"
                id="sinceLeave">
                00:00:00:00
            </div>

        </div>

        <div class="card">

            <div class="card-title">
                帰るまで
            </div>

            <div
                class="time"
                id="untilReturn">
                00:00:00:00
            </div>

        </div>

    </div>

    <div class="middle-star">
        ✦
    </div>

    <div class="footer">
        また会える日まで ʕ •ᴥ•ʔ
    </div>

</div>

<script>

const leaveTime =
    new Date("2026-06-21T18:00:00+09:00");

const returnTime =
    new Date("2026-07-07T17:10:00+09:00");

function formatTime(ms){
    const total =
        Math.max(0, Math.floor(ms / 1000));

    const days =
        Math.floor(total / 86400);

    const hours =
        Math.floor((total % 86400) / 3600);

    const minutes =
        Math.floor((total % 3600) / 60);

    const seconds =
        total % 60;

    return [
        String(days).padStart(2,"0"),
        String(hours).padStart(2,"0"),
        String(minutes).padStart(2,"0"),
        String(seconds).padStart(2,"0")
    ].join(":");
}

function updateClock(){
    const now = new Date();
    let elapsed = 0;

    if (now < leaveTime) {
        document.getElementById("leaveTitle").textContent = "日本を発つまで";
        elapsed = leaveTime - now;
    } else {
        document.getElementById("leaveTitle").textContent = "日本を発ってから";
        elapsed = now - leaveTime;
    }

    const remain = Math.max(0, returnTime - now);

    document.getElementById("sinceLeave").textContent = formatTime(elapsed);
    document.getElementById("untilReturn").textContent = formatTime(remain);
}

updateClock();
setInterval(updateClock, 1000);

const layer = document.getElementById("meteors");

for(let i=0;i<5;i++){
    const meteor = document.createElement("div");
    meteor.className = "meteor";
    meteor.style.left = (80 + Math.random()*40) + "%";
    meteor.style.top = (-20 + Math.random()*30) + "%";
    meteor.style.animationDuration = (4 + Math.random()*4) + "s";
    meteor.style.animationDelay = (Math.random()*10) + "s";
    layer.appendChild(meteor);
}

setInterval(()=>{
    const meteor = document.createElement("div");
    meteor.className = "meteor big-meteor";
    meteor.style.left = "110%";
    meteor.style.top = Math.random()*20 + "%";
    meteor.style.animationDuration = "2.5s";
    layer.appendChild(meteor);

    setTimeout(()=>{
        meteor.remove();
    },3000);
},20000);

</script>

</body>
</html>
